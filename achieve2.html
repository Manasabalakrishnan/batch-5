<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achieve Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: white;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: left;
            padding: 5vw;
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("success.jpg") no-repeat center center/cover;
            opacity: 0.3;
            z-index: -1;
        }

        .text-content {
            max-width: 600px;
        }

        .text-content h1 {
            font-size: 3rem;
            font-weight: normal;
        }

        .text-content h1 span {
            font-weight: bold;
        }

        .text-content p {
            margin-top: 20px;
            font-size: 1rem;
            opacity: 0.8;
        }

        .cta-button {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background: white;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-image"></div>
        <div class="text-content">
            <h1>Don't just do. <span>Achieve.</span></h1>
            <p>A DESIGN, DEVELOPMENT AND MARKETING AGENCY</p>
            <p>What do you want to achieve? Create innovative applications. Increase revenue. Inspire.</p>
            <a href="#" class="cta-button">Learn More</a>
        </div>
    </div>
</body>
</html>
